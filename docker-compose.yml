services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: domaintool
      POSTGRES_PASSWORD: domaintool
      POSTGRES_DB: domaintool
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domaintool"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://domaintool:domaintool@db:5432/domaintool
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
      CORS_ORIGINS: http://localhost:8080,http://frontend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
